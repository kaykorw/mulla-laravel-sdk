name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', laravel: '^10.0', testbench: '^8.0' }
          - { php: '8.2', laravel: '^11.0', testbench: '^9.0' }
          - { php: '8.3', laravel: '^11.0', testbench: '^9.0' }
          - { php: '8.2', laravel: '^12.0', testbench: '^10.0' }
          - { php: '8.3', laravel: '^12.0', testbench: '^10.0' }
          - { php: '8.4', laravel: '^12.0', testbench: '^10.0' }
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@v4
      # Until mulla/mulla-php is on Packagist, the path repository (../mulla-php) supplies it.
      - name: Check out mulla-php next to this repo
        run: git clone --depth 1 https://github.com/${{ github.repository_owner }}/mulla-php.git ../mulla-php
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none
      - run: composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
      - run: composer update --no-interaction --no-progress --prefer-dist --with-all-dependencies
      - run: composer test

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out mulla-php next to this repo
        run: git clone --depth 1 https://github.com/${{ github.repository_owner }}/mulla-php.git ../mulla-php
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: composer update --no-interaction --no-progress --prefer-dist
      - run: composer cs
      - run: composer analyse
